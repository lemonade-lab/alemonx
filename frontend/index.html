<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ALemonX</title>
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('alemonjs-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <main class="grid min-h-screen content-center justify-items-center gap-3 p-5 text-sm">
        <p id="startup-status" role="status">正在启动工作台…</p>
        <button id="startup-retry" type="button" class="secondary-button" hidden>刷新</button>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
