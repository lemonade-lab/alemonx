services:
  alx:
    image: ${YUNZAI_IMAGE:-ccr.ccs.tencentyun.com/ningmengchongshui/alemonx-yunzai:latest}
    container_name: ${YUNZAI_CONTAINER_NAME:-alemonx-yunzai}
    restart: unless-stopped
    ports:
      - "${YUNZAI_PORT:-17390}:17390"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOME: /data
      XDG_CONFIG_HOME: /data/config
      XDG_CACHE_HOME: /data/cache
      ALX_DEPLOYMENT: ${ALX_DEPLOYMENT:-production}
      ALX_OPS_STORAGE: sqlite
      ALX_CONTAINER: "1"
      ALX_WORKSPACE: /app/workspace
      ALEMONJS_SETUP_ROOTS: /app/workspace
      ALX_PRIVILEGED_MODE: disabled
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:17390/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ${YUNZAI_REDIS_CONTAINER_NAME:-alemonx-yunzai-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
