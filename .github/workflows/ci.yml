name: CI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: yarn install --frozen-lockfile --non-interactive
        working-directory: frontend
      - run: yarn lint && yarn build
        working-directory: frontend
      - name: Bundle embedded Yarn
        run: |
          for dir in resources/packages/*; do
            [ -f "$dir/package.json" ] || continue
            [ -f "$dir/package-lock.json" ] || { echo "缺少 $dir/package-lock.json：请提交内置包的锁文件" >&2; exit 1; }
            (cd "$dir" && npm ci --no-bin-links --ignore-scripts --no-audit --no-fund)
          done
      - run: go test ./internal/... && go vet ./internal/... && go build -o /tmp/alemonx .
      # A release must retain one verified package for each primary desktop
      # system. Extra architectures are best-effort in the packaging matrix.
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/alx-windows-amd64.exe .
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/alx-darwin-arm64 .

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel other packages when an optional architecture cannot be
      # built by one dependency. Its job log remains available for diagnosis.
      fail-fast: false
      matrix:
        include:
          # Required: one maintained package for each primary system.
          - { goos: windows, goarch: amd64, binary: alx.exe, bundle: alx-windows-amd64.zip, optional: false }
          - { goos: darwin, goarch: arm64, binary: alx, bundle: alx-darwin-arm64.zip, optional: false }
          - { goos: linux, goarch: amd64, binary: alx, bundle: alx-linux-amd64.zip, optional: false }
          # Best effort: publish when successful, without blocking a release.
          - { goos: windows, goarch: arm64, binary: alx.exe, bundle: alx-windows-arm64.zip, optional: true }
          - { goos: windows, goarch: 386, binary: alx.exe, bundle: alx-windows-386.zip, optional: true }
          - { goos: darwin, goarch: amd64, binary: alx, bundle: alx-darwin-amd64.zip, optional: true }
          - { goos: linux, goarch: arm64, binary: alx, bundle: alx-linux-arm64.zip, optional: true }
          - { goos: linux, goarch: arm, goarm: 7, binary: alx, bundle: alx-linux-armv7.zip, optional: true }
          - { goos: linux, goarch: 386, binary: alx, bundle: alx-linux-386.zip, optional: true }
          - { goos: linux, goarch: ppc64le, binary: alx, bundle: alx-linux-ppc64le.zip, optional: true }
          - { goos: linux, goarch: s390x, binary: alx, bundle: alx-linux-s390x.zip, optional: true }
          - { goos: linux, goarch: riscv64, binary: alx, bundle: alx-linux-riscv64.zip, optional: true }
          - { goos: freebsd, goarch: amd64, binary: alx, bundle: alx-freebsd-amd64.zip, optional: true }
          - { goos: freebsd, goarch: arm64, binary: alx, bundle: alx-freebsd-arm64.zip, optional: true }
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: yarn install --frozen-lockfile --non-interactive && VITE_ALX_BUILD_ID=${GITHUB_REF_NAME} yarn build
        working-directory: frontend
      - name: Bundle embedded Yarn
        run: |
          for dir in resources/packages/*; do
            [ -f "$dir/package.json" ] || continue
            [ -f "$dir/package-lock.json" ] || { echo "缺少 $dir/package-lock.json：请提交内置包的锁文件" >&2; exit 1; }
            (cd "$dir" && npm ci --no-bin-links --ignore-scripts --no-audit --no-fund)
          done
      - run: |
          mkdir -p bundle release
          GOARM=${{ matrix.goarm }} CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME} -X main.FrontendBuild=${GITHUB_REF_NAME}" -o "bundle/${{ matrix.binary }}" .
          printf '{"version":"%s","platform":"%s","architecture":"%s"}\n' "${GITHUB_REF_NAME}" "${{ matrix.goos }}" "${{ matrix.goarch }}" > bundle/alx-update.json
          (cd bundle && zip -r "../release/${{ matrix.bundle }}" .)
          (cd release && sha256sum "${{ matrix.bundle }}" > "${{ matrix.bundle }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: |
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          checksum() { awk -v name="$1" '$2 == name { print $1 }' release/SHA256SUMS; }
          cat release/*.sha256 > release/SHA256SUMS
          printf '{"tag":"%s","name":"AlemonX %s","url":"https://github.com/%s/releases/tag/%s","assets":[' "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" > release/alx-update-index.json
          first=1
          for archive in release/*.zip; do
            name="${archive##*/}"
            [ "$first" = 1 ] || printf ',' >> release/alx-update-index.json
            first=0
            printf '{"name":"%s","url":"%s/%s","sha256":"%s"}' "$name" "$release_base" "$name" "$(checksum "$name")" >> release/alx-update-index.json
          done
          printf ',{"name":"SHA256SUMS","url":"%s/SHA256SUMS"}]}' "$release_base" >> release/alx-update-index.json
          rm release/*.sha256
          gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # Keep a permanent `latest` git tag pointing at the newest release so
      # third-party scripts can consume refs/tags/latest (for example
      # releases/download/latest/alx-update-index.json) without knowing the
      # version. The tag is force-moved on every release.
      - name: Move latest tag to this release
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
