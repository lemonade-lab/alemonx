name: 发布腾讯云 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      tencent_registry:
        description: 腾讯云 TCR/CCR 仓库域名
        required: true
        default: ccr.ccs.tencentyun.com
        type: string
      namespace:
        description: 腾讯云镜像命名空间
        required: true
        default: ningmengchongshui
        type: string
      image_name:
        description: 腾讯云镜像仓库名称
        required: true
        default: alemonx
        type: string
      tag:
        description: 要发布的镜像标签
        required: true
        default: latest
        type: string
      registry_username:
        description: 腾讯云镜像仓库登录账号
        required: true
        type: string
      runtime_base:
        description: Dockerfile 使用的腾讯云运行时基础镜像
        required: true
        default: ccr.ccs.tencentyun.com/ningmengchongshui/alemonbase:latest
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    name: 构建并发布
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.tencent_registry }}/${{ inputs.namespace }}/${{ inputs.image_name }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.tencent_registry }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并发布多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: |
            ALX_RUNTIME_BASE=${{ inputs.runtime_base }}
            VERSION=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
