name: Docker alemonx push

on:
  workflow_dispatch:
    inputs:
      tencent_registry:
        description: 腾讯云 TCR/CCR 仓库域名
        required: true
        default: ccr.ccs.tencentyun.com
        type: string
      namespace:
        description: 腾讯云镜像命名空间
        required: true
        default: ningmengchongshui
        type: string
      image_name:
        description: 腾讯云镜像仓库名称
        required: true
        default: alemonx
        type: string
      registry_username:
        description: 腾讯云镜像仓库登录账号
        required: true
        type: string
      docker_password:
        description: 腾讯云镜像仓库登录密码或访问令牌
        required: true
        type: string
      runtime_base:
        description: Dockerfile 使用的腾讯云运行时基础镜像
        required: true
        default: ccr.ccs.tencentyun.com/ningmengchongshui/alemonbase:latest
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    name: 构建并发布
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.tencent_registry }}/${{ inputs.namespace }}/${{ inputs.image_name }}
      DOCKER_PASSWORD: ${{ inputs.docker_password }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取最新 Git 标签版本
        id: version
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 遮罩登录密码
        run: echo "::add-mask::$DOCKER_PASSWORD"

      - name: 登录腾讯云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.tencent_registry }}
          username: ${{ inputs.registry_username }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: 构建并发布多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            ALX_RUNTIME_BASE=${{ inputs.runtime_base }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
