name: Docker alemonx push

on:
  workflow_dispatch:
    inputs:
      tencent_registry:
        description: 腾讯云 TCR/CCR 仓库域名，例如 ccr.ccs.tencentyun.com
        required: false
        default: ccr.ccs.tencentyun.com
        type: string
      namespace:
        description: 腾讯云镜像命名空间，例如 ningmengchongshui
        required: false
        default: ningmengchongshui
        type: string
      image_name:
        description: 腾讯云应用镜像仓库名称，例如 alemonx
        required: false
        default: alemonx
        type: string
      version:
        description: 应用镜像版本标签，留空使用 Git 提交 SHA，同时更新 latest
        required: false
        type: string
      registry_username:
        description: 腾讯云镜像仓库登录账号
        required: true
        type: string
      docker_password:
        description: 腾讯云镜像仓库登录密码或访问令牌
        required: true
        type: string
      runtime_base:
        description: 腾讯云运行时基础镜像，例如 ccr.ccs.tencentyun.com/ningmengchongshui/alemonbase:latest
        required: false
        default: ccr.ccs.tencentyun.com/ningmengchongshui/alemonbase:latest
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 遮罩登录密码
        uses: actions/github-script@v7
        with:
          script: core.setSecret(context.payload.inputs.docker_password)

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 在 Runner 上构建前端
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: 安装并构建前端
        run: ./scripts/build-frontend.sh

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.tencent_registry }}
          username: ${{ inputs.registry_username }}
          password: ${{ inputs.docker_password }}

      - name: 构建并发布多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ inputs.tencent_registry }}/${{ inputs.namespace }}/${{ inputs.image_name }}:latest
            ${{ inputs.tencent_registry }}/${{ inputs.namespace }}/${{ inputs.image_name }}:${{ inputs.version || github.sha }}
          build-args: |
            ALX_RUNTIME_BASE=${{ inputs.runtime_base }}
            VERSION=${{ inputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
