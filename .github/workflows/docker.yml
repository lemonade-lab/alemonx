name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签，例如 v1.2.3'
        required: true
        type: string
      registry:
        description: '镜像仓库地址'
        required: true
        default: 'ccr.ccs.tencentyun.com/ningmengchongshui/alemonx'
        type: string
      login:
        description: '镜像仓库登录地址'
        required: true
        default: 'ccr.ccs.tencentyun.com'
        type: string
      username:
        description: '腾讯云镜像仓库用户名'
        required: true
        default: 'ningmengchongshui'
        type: string
      password:
        description: '镜像仓库密码或临时令牌；仅在勾选推送时需要'
        required: false
        type: string
      platforms:
        description: 'Buildx 目标平台，逗号分隔'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: string
      push:
        description: '确认后推送到 GHCR；未勾选时只执行构建验证'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push && inputs.password != ''
        with:
          registry: ${{ inputs.login }}
          username: ${{ inputs.username }}
          password: ${{ inputs.password }}
      - name: 校验发布凭据
        if: inputs.push && inputs.password == ''
        run: |
          echo '勾选推送时必须填写镜像仓库密码或临时令牌。' >&2
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.registry }}:latest
            ${{ inputs.registry }}:${{ inputs.version }}
          build-args: VERSION=${{ inputs.version }}
